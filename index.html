<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票交易流程可视化</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid h-100">
        <!-- Header -->
        <div class="row header">
            <div class="col-12">
                <h1 class="text-center py-3 mb-0">
                    <i class="fas fa-chart-line me-2"></i>股票交易流程可视化
                </h1>
            </div>
        </div>

        <!-- Main Content -->
        <div class="row main-content">
            <!-- Left Panel - Controls -->
            <div class="col-md-3 col-lg-3 left-panel">
                <div class="panel-section">
                    <h5><i class="fas fa-cog me-2"></i>订单创建</h5>
                    <form id="orderForm">
                        <div class="mb-3">
                            <label class="form-label">股票代码</label>
                            <input type="text" class="form-control" id="stockCode" placeholder="如: 000001" value="000001">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">订单类型</label>
                            <select class="form-select" id="orderType">
                                <option value="limit">限价单</option>
                                <option value="market">市价单</option>
                                <option value="stop">止损单</option>
                                <option value="stop_limit">止损限价单</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">数量</label>
                            <input type="number" class="form-control" id="quantity" placeholder="100" value="100">
                        </div>
                        <div class="mb-3" id="priceGroup">
                            <label class="form-label">价格</label>
                            <input type="number" class="form-control" id="price" placeholder="10.50" value="10.50" step="0.01">
                        </div>
                        <button type="button" class="btn btn-primary w-100" id="createOrderBtn">
                            <i class="fas fa-plus me-2"></i>创建订单
                        </button>
                    </form>
                </div>

                <div class="panel-section">
                    <h5><i class="fas fa-list me-2"></i>预设场景</h5>
                    <select class="form-select mb-3" id="scenarioSelect">
                        <option value="normal_buy">正常买入</option>
                        <option value="instant_fill">立即成交</option>
                        <option value="partial_fill">部分成交</option>
                        <option value="cancellation">撤单流程</option>
                        <option value="rejection">订单拒绝</option>
                        <option value="auction">集合竞价</option>
                    </select>
                </div>

                <div class="panel-section">
                    <h5><i class="fas fa-play-circle me-2"></i>控制面板</h5>
                    <div class="btn-group w-100 mb-3" role="group">
                        <button type="button" class="btn btn-success" id="playBtn" disabled>
                            <i class="fas fa-play"></i>
                        </button>
                        <button type="button" class="btn btn-warning" id="pauseBtn" disabled>
                            <i class="fas fa-pause"></i>
                        </button>
                        <button type="button" class="btn btn-info" id="stepBtn" disabled>
                            <i class="fas fa-step-forward"></i>
                        </button>
                        <button type="button" class="btn btn-danger" id="resetBtn" disabled>
                            <i class="fas fa-redo"></i>
                        </button>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">播放速度:</label>
                        <select class="form-select" id="speedSelect">
                            <option value="0.1">0.1x (很慢)</option>
                            <option value="0.25">0.25x (较慢)</option>
                            <option value="0.5">0.5x (慢速)</option>
                            <option value="1" selected>1x (正常)</option>
                        </select>
                    </div>
                </div>

                <div class="panel-section">
                    <h5><i class="fas fa-tachometer-alt me-2"></i>进度统计</h5>
                    <div id="progressStats">
                        <div class="mb-2">
                            <small>当前状态: <span id="currentState" class="badge bg-secondary">未开始</span></small>
                        </div>
                        <div class="mb-2">
                            <small>已用时间: <span id="elapsedTime">0s</span></small>
                        </div>
                        <div class="mb-2">
                            <small>完成进度: <span id="progressPercent">0%</span></small>
                        </div>
                        <div class="progress">
                            <div class="progress-bar" id="progressBar" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Middle Panel - Visualization -->
            <div class="col-md-6 col-lg-6 middle-panel">
                <div class="panel-section">
                    <h5><i class="fas fa-project-diagram me-2"></i>流程可视化</h5>
                    <div id="flowchart-container" class="text-center">
                        <div class="placeholder-text">
                            <i class="fas fa-play-circle fa-3x text-muted mb-3 d-block"></i>
                            请点击"创建订单"开始演示
                        </div>
                    </div>
                </div>

                <div class="panel-section timeline-section">
                    <h5><i class="fas fa-clock me-2"></i>时间线</h5>
                    <div id="timeline-container">
                        <div class="placeholder-text text-center">
                            <i class="fas fa-clock fa-2x text-muted mb-2 d-block"></i>
                            时间线将在订单创建后显示
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel - Information -->
            <div class="col-md-3 col-lg-3 right-panel">
                <div class="panel-section">
                    <h5><i class="fas fa-info-circle me-2"></i>状态说明</h5>
                    <div id="stateInfo">
                        <div class="alert alert-info">
                            <i class="fas fa-hand-point-left me-2"></i>
                            创建订单后，此处将显示当前状态的详细说明。
                        </div>
                    </div>
                </div>

                <div class="panel-section">
                    <h5><i class="fas fa-users me-2"></i>相关方</h5>
                    <div id="participantsInfo">
                        <div class="list-group">
                            <div class="list-group-item participant-item">
                                <i class="fas fa-user text-primary me-2"></i>
                                <strong>投资者</strong>
                                <small class="d-block text-muted">交易发起者</small>
                            </div>
                            <div class="list-group-item participant-item">
                                <i class="fas fa-building text-success me-2"></i>
                                <strong>券商系统</strong>
                                <small class="d-block text-muted">提供交易通道</small>
                            </div>
                            <div class="list-group-item participant-item">
                                <i class="fas fa-university text-warning me-2"></i>
                                <strong>交易所</strong>
                                <small class="d-block text-muted">订单撮合服务</small>
                            </div>
                            <div class="list-group-item participant-item">
                                <i class="fas fa-shield-alt text-info me-2"></i>
                                <strong>清算所</strong>
                                <small class="d-block text-muted">中央对手方清算</small>
                            </div>
                            <div class="list-group-item participant-item">
                                <i class="fas fa-safe text-secondary me-2"></i>
                                <strong>存管机构</strong>
                                <small class="d-block text-muted">证券托管服务</small>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="panel-section">
                    <h5><i class="fas fa-cogs me-2"></i>转换条件</h5>
                    <div id="transitionInfo">
                        <div class="alert alert-light">
                            <i class="fas fa-arrow-right me-2"></i>
                            状态转换时，此处将显示转换条件和说明。
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="row footer">
        <div class="col-12 text-center py-2">
            <small class="text-muted">
                <i class="fas fa-graduation-cap me-1"></i>
                股票交易流程可视化 - 教育培训专用
            </small>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script src="js/orderFlow.js"></script>
    <script src="js/visualization.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
